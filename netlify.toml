# SilkierStrands.com — Netlify Configuration

[build]
  # Build: enforce direct, live title-matched ASINs → generate sitemap → Vite build → static prerender
  command = "pnpm install && node scripts/validate-commerce-template.mjs && node scripts/validate-asins.mjs && if [ -n \"$CREATORS_API_CLIENT_ID\" ] && [ -n \"$CREATORS_API_CLIENT_SECRET\" ] && [ -n \"$CREATORS_API_PARTNER_TAG\" ]; then node scripts/fetch-prices.js; else echo 'Creators API credentials unavailable; price UI will hide catalog values.'; fi && node scripts/generate-sitemap.mjs && pnpm build && node scripts/prerender.mjs && echo ${COMMIT_REF:-local} > dist/public/version.txt"
  publish = "dist/public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  PNPM_VERSION = "10"

[functions]
  node_bundler = "esbuild"

# ─── API routes → Netlify Functions ──────────────────────────────────────────
# POST /api/subscribe → subscribe.mjs (email capture + EmailOctopus segmentation)
[[redirects]]
  from = "/api/subscribe"
  to = "/.netlify/functions/subscribe"
  status = 200
  force = true

# Priority 2: www → non-www (301 permanent redirect)
[[redirects]]
  from = "https://www.silkierstrands.com/*"
  to = "https://silkierstrands.com/:splat"
  status = 301
  force = true

# Priority 2: http → https (belt-and-suspenders; Netlify enforces HTTPS automatically)
[[redirects]]
  from = "http://silkierstrands.com/*"
  to = "https://silkierstrands.com/:splat"
  status = 301
  force = true

# SPA routing — serve index.html for any route not matched by a prerendered file
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Cache static assets aggressively
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache sitemap for 1 day
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Cache robots.txt for 1 week
[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Cache PDF guides for 30 days
[[headers]]
  for = "/guides/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

