# SilkierStrands.com — Netlify Configuration

[build]
  # Priority 1: Build then run static prerender to generate per-route HTML with correct SEO tags
  command = "pnpm install && node scripts/generate-sitemap.mjs && pnpm build && node scripts/prerender.mjs"
  publish = "dist/public"

[build.environment]
  NODE_VERSION = "20"
  PNPM_VERSION = "10"

# Priority 2: www → non-www (301 permanent redirect)
[[redirects]]
  from = "https://www.silkierstrands.com/*"
  to = "https://silkierstrands.com/:splat"
  status = 301
  force = true

# Priority 2: http → https (belt-and-suspenders; Netlify enforces HTTPS automatically)
[[redirects]]
  from = "http://silkierstrands.com/*"
  to = "https://silkierstrands.com/:splat"
  status = 301
  force = true

# SPA routing — serve index.html for any route not matched by a prerendered file
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Cache static assets aggressively
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache sitemap for 1 day
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Cache robots.txt for 1 week
[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=604800"

