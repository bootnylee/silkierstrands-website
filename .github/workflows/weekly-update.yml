# SilkierStrands.com — Weekly Content Update Workflow
# Runs every Monday at 6:00 AM ET (11:00 UTC)
# Adds new reviews and comparisons, regenerates sitemap, triggers Netlify deploy

name: Weekly Content Update

on:
  schedule:
    - cron: '0 11 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no commit)'
        required: false
        default: 'false'

jobs:
  weekly-update:
    name: Add Weekly Content & Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Calculate week number
        id: week
        run: |
          LAUNCH_EPOCH=$(python3 -c "import datetime; print(int(datetime.datetime(2025,4,24).timestamp()))")
          TODAY_EPOCH=$(date +%s)
          WEEK_NUM=$(( (TODAY_EPOCH - LAUNCH_EPOCH) / 604800 + 1 ))
          echo "week_number=$WEEK_NUM" >> $GITHUB_OUTPUT
          echo "Running Week $WEEK_NUM update"

      - name: Run weekly content update script
        run: node scripts/weekly-update.mjs
        env:
          WEEK_NUMBER: ${{ steps.week.outputs.week_number }}

      - name: Link and image health check
        run: |
          node scripts/check-links.js
          BROKEN=$(python3 -c "import json; d=json.load(open('link-report.json')); print(d['summary'].get('BROKEN', 0))")
          echo "BROKEN count: ${BROKEN}"
          if [ "$BROKEN" -gt 0 ]; then
            echo "::error::Link checker found ${BROKEN} BROKEN link(s)/image(s). See link-report.json."
            exit 1
          fi
          echo "No BROKEN links. INCONCLUSIVE results (e.g. Amazon bot-blocks) do not fail the job."

      - name: Creators API price sync
        env:
          CREATORS_CREDENTIAL_ID: ${{ secrets.CREATORS_CREDENTIAL_ID }}
          CREATORS_CREDENTIAL_SECRET: ${{ secrets.CREATORS_CREDENTIAL_SECRET }}
          PAAPI_PARTNER_TAG: ${{ secrets.PAAPI_PARTNER_TAG }}
        run: |
          if [ -n "$CREATORS_CREDENTIAL_ID" ]; then
            echo "Creators API credentials present - running live price sync."
            node scripts/fetch-prices.js
          else
            echo "Creators API credentials not configured - running dry-run price sync with mock fixture."
            node scripts/fetch-prices.js --dry-run
          fi

      - name: Regenerate sitemap
        run: node scripts/generate-sitemap.mjs

      - name: Run SEO audit
        run: node scripts/seo-audit.mjs

      - name: Build site to verify no errors
        run: pnpm build
        env:
          VITE_ANALYTICS_ENDPOINT: ${{ secrets.VITE_ANALYTICS_ENDPOINT || 'https://analytics.silkierstrands.com' }}
          VITE_ANALYTICS_WEBSITE_ID: ${{ secrets.VITE_ANALYTICS_WEBSITE_ID || 'silkierstrands' }}
          VITE_APP_ID: silkierstrands
          VITE_APP_TITLE: SilkierStrands
          VITE_FRONTEND_FORGE_API_KEY: ${{ secrets.VITE_FRONTEND_FORGE_API_KEY || '' }}
          VITE_FRONTEND_FORGE_API_URL: ${{ secrets.VITE_FRONTEND_FORGE_API_URL || '' }}

      - name: Commit and push updates
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "SilkierStrands Weekly Bot"
          git add -A
          git diff --staged --quiet || git commit -m "chore: weekly content update $(date +'%Y-%m-%d' ) - new reviews and comparisons"
          git push

      - name: Trigger Netlify deploy
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          curl -s -X POST "${{ secrets.NETLIFY_BUILD_HOOK }}" \
            -H "Content-Type: application/json" \
            -d '{"trigger_title":"Weekly content update"}' \
            || echo "Netlify hook not configured — deploy manually or add NETLIFY_BUILD_HOOK secret"

      - name: Ping search engines
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: node scripts/ping-search-engines.mjs

      - name: Upload SEO audit report
        uses: actions/upload-artifact@v7
        with:
          name: seo-audit-week-${{ steps.week.outputs.week_number }}
          path: seo-audit-report.json
          retention-days: 90

      - name: Job summary
        run: |
          echo "## Week ${{ steps.week.outputs.week_number }} Update Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- New product reviews added" >> $GITHUB_STEP_SUMMARY
          echo "- New comparisons added" >> $GITHUB_STEP_SUMMARY
          echo "- Sitemap regenerated" >> $GITHUB_STEP_SUMMARY
          echo "- SEO audit completed" >> $GITHUB_STEP_SUMMARY
          echo "- Netlify deploy triggered" >> $GITHUB_STEP_SUMMARY
          echo "- Search engines pinged" >> $GITHUB_STEP_SUMMARY
