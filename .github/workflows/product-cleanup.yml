name: Product Availability Cleanup

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Decode script and data
        run: |
          printf '%s' "" | base64 -d > /tmp/verify_replace.mjs
          printf '%s' "" | base64 -d > /tmp/cleanup_data.json
          echo "Script size: $(wc -c < /tmp/verify_replace.mjs) bytes"
          echo "Data size: $(wc -c < /tmp/cleanup_data.json) bytes"

      - name: Run verification and replacement search
        env:
          CREATORS_CREDENTIAL_ID: ${{ secrets.CREATORS_CREDENTIAL_ID }}
          CREATORS_CREDENTIAL_SECRET: ${{ secrets.CREATORS_CREDENTIAL_SECRET }}
          PAAPI_PARTNER_TAG: ${{ secrets.PAAPI_PARTNER_TAG }}
        run: node /tmp/verify_replace.mjs 2>&1 | tee /tmp/cleanup_log.txt

      - name: Upload results
        uses: actions/upload-artifact@v7
        with:
          name: replacement-plan
          path: |
            /tmp/replacement_plan.json
            /tmp/cleanup_log.txt
          retention-days: 3
